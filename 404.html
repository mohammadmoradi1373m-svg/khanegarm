<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>در حال انتقال… | خانه‌گرم</title>
</head>
<body>
<script>
(function () {
  // GitHub Pages has no server-side SPA fallback. Keep the exact clean route,
  // query and Supabase auth hash in the URL so index.html can restore it.
  var target = location.pathname + location.search;
  var q = '?__spa_path=' + encodeURIComponent(target);
  location.replace('/' + q + location.hash);
})();
</script>
<noscript>برای ادامه، JavaScript را فعال کنید.</noscript>
</body>
</html>
